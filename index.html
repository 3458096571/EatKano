<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>星空音游 - Starlight Rhythm</title>
    
    <!-- Google Fonts for futuristic look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="static/index.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>">
</head>
<body>
    <!-- Canvas for animated starfield background -->
    <canvas id="bgCanvas"></canvas>
    
    <!-- Glowing grid overlay -->
    <div class="grid-overlay"></div>
    
    <!-- Welcome Screen with Glassmorphism -->
    <div id="welcome" class="glass-panel">
        <div class="welcome-content">
            <h1 class="game-title" data-i18n="game-title">星空音游</h1>
            <p class="game-intro" data-i18n="game-intro1">点击闪烁的星星</p>
            <p class="game-intro" data-i18n="game-intro2">看你能得多少分</p>
            
            <!-- Preset Selector -->
            <div class="preset-selector">
                <label data-i18n="preset-label">选择主题:</label>
                <div class="preset-options">
                    <div class="preset-option active" data-preset="1">
                        <img src="static/image/ClickBefore_1.png" alt="Preset 1">
                    </div>
                    <div class="preset-option" data-preset="2">
                        <img src="static/image/ClickBefore_2.png" alt="Preset 2">
                    </div>
                    <div class="preset-option" data-preset="3">
                        <img src="static/image/ClickBefore_3.png" alt="Preset 3">
                    </div>
                    <div class="preset-option" data-preset="4">
                        <img src="static/image/ClickBefore_4.png" alt="Preset 4">
                    </div>
                </div>
            </div>
            
            <button id="startBtn" class="btn-glow" data-i18n="start">开始游戏</button>
        </div>
    </div>
    
    <!-- Game Container -->
    <div id="game" class="hidden">
        <div class="game-header glass-panel">
            <div class="score-display">
                <span class="score-label" data-i18n="score">得分</span>
                <span id="score" class="score-value">0</span>
            </div>
            <div class="timer-display">
                <span class="timer-label" data-i18n="time">时间</span>
                <span id="timer" class="timer-value">60</span>
            </div>
        </div>
        
        <div id="gameArea" class="game-area">
            <!-- Game blocks will be generated here -->
        </div>
    </div>
    
    <!-- End Screen -->
    <div id="end" class="hidden glass-panel">
        <div class="end-content">
            <h2 class="end-title" data-i18n="game-over">游戏结束</h2>
            <div class="final-score">
                <span data-i18n="final-score">最终得分</span>
                <span id="finalScore" class="final-score-value">0</span>
            </div>
            <div class="rank-display">
                <span data-i18n="rank">评级</span>
                <span id="rank" class="rank-value">S</span>
            </div>
            <button id="restartBtn" class="btn-glow" data-i18n="restart">再来一次</button>
            <button id="homeBtn" class="btn-outline" data-i18n="home">返回首页</button>
        </div>
    </div>
    
    <!-- Hit FX Container -->
    <div id="hitFxContainer"></div>
    
    <script src="static/index.js"></script>
</body>
</html>
